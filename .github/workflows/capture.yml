# One-off snapshot of the original Framer site, used as the reference for the Next.js rebuild.
# Commits page outlines, images and screenshots to the `capture` branch (never to main).
name: Capture Framer site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUT: capture-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tools/capture
        run: |
          npm init -y >/dev/null
          npm i playwright@1
          npx playwright install --with-deps chromium

      - name: Capture pages, DOM and screenshots
        working-directory: tools/capture
        run: OUT="$GITHUB_WORKSPACE/new-out" node pull.mjs

      - name: Build outline
        working-directory: tools/capture
        run: OUT="$GITHUB_WORKSPACE/new-out" node outline.mjs

      - name: Update capture branch with new DOM dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin capture:capture
          git checkout -f capture
          rm -rf capture-out/dom capture-out/outline.txt
          cp -r "$GITHUB_WORKSPACE/new-out/dom" "$GITHUB_WORKSPACE/new-out/outline.txt" capture-out/
          git add capture-out
          git commit -qm "Re-capture DOM with display:contents wrappers"
          git push origin capture
